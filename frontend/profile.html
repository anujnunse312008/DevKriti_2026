<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile | StoryForge AI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/profile.css">

</head>


<body>


<div class="profile-layout">
<div id="sidebarOverlay" class="sidebar-overlay"></div>

    <aside class="sidebar">


        <h2 class="logo">StoryForge</h2>


        <ul>


            <li onclick="location.href='dashboard.html'">

                <i class="fa-solid fa-house"></i>

                Dashboard

            </li>


            <li onclick="location.href='story.html'">

                <i class="fa-solid fa-pen"></i>

                New Story

            </li>


            <li onclick="location.href='mystories.html'">

                <i class="fa-solid fa-book"></i>

                My Stories

            </li>


            <li class="active">

                <i class="fa-solid fa-user"></i>

                Profile

            </li>


            <li id="logoutBtn">

                <i class="fa-solid fa-right-from-bracket"></i>

                Logout

            </li>


        </ul>


    </aside>

    <button id="menuBtn" class="menu-btn">

    <i class="fa-solid fa-bars"></i>

</button>

    <main class="profile-main">


        <h1>My Profile</h1>



        <div class="profile-card">


            <div class="profile-header">


                <div class="profile-avatar">

    <i class="fa-solid fa-circle-user"></i>

</div>

            </div>



            <form id="profileForm">


                <div class="row">


                    <div class="input-group">


                        <label>Full Name</label>


                        <input
type="text"
id="fullName">


                    </div>



                    <div class="input-group">


                        <label>Email</label>


                        <input
type="email"
id="email"
readonly>


                    </div>


                </div>



                <div class="input-group">


                    <label>Bio</label>


                    <textarea
id="bio"
placeholder="Tell something about yourself..."></textarea>


                </div>



                <div class="row">


                    <div class="input-group">

    <label>Current Password</label>

    <input
    type="password"
    id="currentPassword">

</div>

<div class="row">

    <div class="input-group">

        <label>New Password</label>

        <input
        type="password"
        id="newPassword">

    </div>

    <div class="input-group">

        <label>Confirm Password</label>

        <input
        type="password"
        id="confirmPassword">

    </div>

</div>



                <button
type="submit"
class="btn-primary save-btn">


                    Save Changes


                </button>


            </form>


        </div>


    </main>


</div>



<script type="module" src="js/commonAuth.js"></script>
<script type="module" src="js/profile.js"></script>

</body>

</html>
