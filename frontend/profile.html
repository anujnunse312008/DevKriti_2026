<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile | StoryForge AI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/profile.css">

</head>


<body>


<div class="profile-layout">


    <aside class="sidebar">


        <h2 class="logo">StoryForge</h2>


        <ul>


            <li onclick="location.href='dashboard.html'">

                <i class="fa-solid fa-house"></i>

                Dashboard

            </li>


            <li onclick="location.href='story.html'">

                <i class="fa-solid fa-pen"></i>

                New Story

            </li>


            <li onclick="location.href='mystories.html'">

                <i class="fa-solid fa-book"></i>

                My Stories

            </li>


            <li class="active">

                <i class="fa-solid fa-user"></i>

                Profile

            </li>


            <li id="logoutBtn">

                <i class="fa-solid fa-right-from-bracket"></i>

                Logout

            </li>


        </ul>


    </aside>



    <main class="profile-main">


        <h1>My Profile</h1>



        <div class="profile-card">


            <div class="profile-header">


                <img src="images/avatar.png" alt="Avatar">


                <button class="btn-outline">

                    Change Photo

                </button>


            </div>



            <form>


                <div class="row">


                    <div class="input-group">


                        <label>Full Name</label>


                        <input
                        type="text"
                        value="Anuj">


                    </div>



                    <div class="input-group">


                        <label>Email</label>


                        <input
                        type="email"
                        value="anuj@example.com">


                    </div>


                </div>



                <div class="input-group">


                    <label>Bio</label>


                    <textarea placeholder="Tell something about yourself..."></textarea>


                </div>



                <div class="row">


                    <div class="input-group">


                        <label>New Password</label>


                        <input type="password">


                    </div>



                    <div class="input-group">


                        <label>Confirm Password</label>


                        <input type="password">


                    </div>


                </div>



                <button class="btn-primary save-btn">


                    Save Changes


                </button>


            </form>


        </div>


    </main>


</div>



<script type="module" src="js/commonAuth.js"></script>


</body>

</html>
