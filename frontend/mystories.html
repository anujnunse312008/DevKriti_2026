<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Stories | StoryForge AI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/stories.css">

</head>

<body>

<div class="stories-layout">
<div id="sidebarOverlay" class="sidebar-overlay"></div>
    <aside class="sidebar">

        <h2 class="logo">StoryForge</h2>

        <ul>

            <li onclick="location.href='dashboard.html'">
                <i class="fa-solid fa-house"></i>
                Dashboard
            </li>

            <li onclick="location.href='story.html'">
                <i class="fa-solid fa-pen"></i>
                New Story
            </li>

            <li class="active">
                <i class="fa-solid fa-book"></i>
                My Stories
            </li>

            <li onclick="location.href='profile.html'">
                <i class="fa-solid fa-user"></i>
                Profile
            </li>

            <li id="logoutBtn">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </li>

        </ul>

    </aside>
    <button id="menuBtn" class="menu-btn">

    <i class="fa-solid fa-bars"></i>

</button>
    <main class="stories-main">

        <div class="stories-header">

            <h1>My Stories</h1>

            <button
            onclick="location.href='story.html'"
            class="btn-primary">

                + New Story

            </button>

        </div>

        <div class="search-box">

            <input
    type="text"
    id="searchInput"
    placeholder="Search stories..."
>

        </div>

        <div class="story-grid">

            <p>Loading stories...</p>

        </div>

    </main>

</div>

<script type="module" src="js/commonAuth.js"></script>
<script type="module" src="js/mystories.js"></script>

</body>

</html>
